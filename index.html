<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#2b2b33" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Cannstatt Cruiser" />
    <meta name="description" content="Pixel-Skate-Runner durch Stuttgart und Bad Cannstatt" />
    <!-- Files below are provided by the PWA slice in public/ (see docs/ARCHITECTURE.md). -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>Cannstatt Cruiser</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        overscroll-behavior: none;
        background: #2b2b33;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
        -webkit-tap-highlight-color: transparent;
        -webkit-text-size-adjust: 100%;
      }
      body {
        position: fixed;
        inset: 0;
      }
      #game {
        position: absolute;
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        touch-action: none;
        outline: none;
      }
    </style>
  </head>
  <body>
    <canvas id="game" aria-label="Cannstatt Cruiser Spielfeld"></canvas>
    <noscript>Für dieses Spiel wird JavaScript benötigt.</noscript>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
